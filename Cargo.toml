[workspace]
resolver = "2"
members = ["crates/bd-net", "crates/bd-core", "crates/bd-cli", "crates/bd-app"]
# Local, unpublished UI experiments live in their own workspace.
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/berguitta/BDownloader"
rust-version = "1.95"
publish = false

[workspace.dependencies]
bd-net = { path = "crates/bd-net" }
bd-core = { path = "crates/bd-core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2", "charset", "json", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"
slint-build = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
# deny, not forbid: Slint's generated code locally allows unsafe blocks.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
