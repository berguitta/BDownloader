name: Feature request
description: Suggest an idea or a new hoster / debrid service.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This does not involve solving or bypassing captchas or anti-bot protections.
          required: true
