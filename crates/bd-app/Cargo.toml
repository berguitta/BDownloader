[package]
name = "bd-app"
description = "BDownloader desktop application (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bdownloader"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = { version = "3", default-features = false }
bd-core.workspace = true
bd-net.workspace = true
slint.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
png = { version = "0.18", optional = true }

[features]
# Headless screenshots for development and CI (see src/snapshot.rs).
snapshot = ["dep:png", "slint/software-renderer-systemfonts"]

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
