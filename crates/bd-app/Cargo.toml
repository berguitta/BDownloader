[package]
name = "bd-app"
description = "BDownloader desktop application (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bdownloader"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = { version = "3", default-features = false }
bd-core.workspace = true
bd-net.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
png = "0.18"
tray-icon = "0.27.0"
notify-rust = "4.19.0"
tokio-util.workspace = true
rfd = "0.18.0"
serde_json.workspace = true
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
directories.workspace = true
reqwest.workspace = true

[features]
# Headless screenshots for development and CI (see src/snapshot.rs).
snapshot = ["slint/software-renderer-systemfonts"]

[build-dependencies]
slint-build.workspace = true
winresource = "0.1.34"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange"] }
